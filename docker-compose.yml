services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook_pw
      POSTGRES_DB: webhooks
    ports:
      - "5433:5432"
    volumes:
      - webhook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhooks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=webhooks;Username=webhook;Password=webhook_pw"
    ports:
      - "5080:8080"

volumes:
  webhook_pgdata:
